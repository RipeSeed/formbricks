services:
  postgres:
    restart: always
    image: pgvector/pgvector:pg18
    shm_size: 512mb
    volumes:
      - postgres:/var/lib/postgresql
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: formbricks
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  authzed-db-bootstrap:
    image: pgvector/pgvector:pg18
    restart: "no"
    exclude_from_hc: true
    entrypoint:
      - /bin/sh
      - -ec
      - |
        if [ -z "$$POSTGRES_ADMIN_URL" ]; then
          echo "POSTGRES_ADMIN_URL is required." >&2
          exit 1
        fi
        if [ -z "$$AUTHZED_DATABASE_PASSWORD" ]; then
          echo "AUTHZED_DATABASE_PASSWORD is required for bundled SpiceDB." >&2
          exit 1
        fi
        psql "$$POSTGRES_ADMIN_URL" \
          --set=ON_ERROR_STOP=1 \
          --set=database_name="$$AUTHZED_DATABASE_NAME" \
          --set=database_username="$$AUTHZED_DATABASE_USERNAME" \
          --set=database_password="$$AUTHZED_DATABASE_PASSWORD" <<'SQL'
        SELECT format('CREATE ROLE %I LOGIN PASSWORD %L', :'database_username', :'database_password')
        WHERE NOT EXISTS (
          SELECT 1 FROM pg_roles WHERE rolname = :'database_username'
        ) \gexec

        SELECT format('ALTER ROLE %I WITH LOGIN PASSWORD %L', :'database_username', :'database_password') \gexec

        SELECT format('CREATE DATABASE %I OWNER %I', :'database_name', :'database_username')
        WHERE NOT EXISTS (
          SELECT 1 FROM pg_database WHERE datname = :'database_name'
        ) \gexec

        SELECT format('ALTER DATABASE %I OWNER TO %I', :'database_name', :'database_username') \gexec
        SQL
        printf '%s\n' "AuthZed database bootstrap completed."
    environment:
      POSTGRES_ADMIN_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/postgres?sslmode=disable
      AUTHZED_DATABASE_NAME: spicedb
      AUTHZED_DATABASE_USERNAME: spicedb
      AUTHZED_DATABASE_PASSWORD: ${AUTHZED_DATABASE_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy

  spicedb-migrate:
    image: authzed/spicedb:v1.57.1
    restart: "no"
    exclude_from_hc: true
    command: datastore migrate head
    environment:
      SPICEDB_DATASTORE_ENGINE: postgres
      SPICEDB_DATASTORE_CONN_URI: postgresql://spicedb:${AUTHZED_DATABASE_PASSWORD}@postgres:5432/spicedb?sslmode=disable
    depends_on:
      authzed-db-bootstrap:
        condition: service_completed_successfully

  spicedb:
    image: authzed/spicedb:v1.57.1
    restart: always
    command: serve
    mem_limit: 512m
    environment:
      SPICEDB_DATASTORE_ENGINE: postgres
      SPICEDB_DATASTORE_CONN_URI: postgresql://spicedb:${AUTHZED_DATABASE_PASSWORD}@postgres:5432/spicedb?sslmode=disable
      SPICEDB_GRPC_PRESHARED_KEY: ${AUTHZED_TOKEN}
      SPICEDB_LOG_FORMAT: json
      SPICEDB_LOG_LEVEL: info
      SPICEDB_TELEMETRY_ENDPOINT: ""
    depends_on:
      spicedb-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/usr/local/bin/grpc_health_probe", "-addr=localhost:50051"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    restart: always
    image: valkey/valkey@sha256:418652cfb58ef879d4978c33553735d7147016032d5aefaa14c828e611eb9dfd
    command: valkey-server --appendonly yes --maxmemory-policy noeviction
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  formbricks-migrate:
    image: ghcr.io/formbricks/formbricks:latest
    restart: "no"
    exclude_from_hc: true
    entrypoint: ["sh", "-c"]
    command:
      [
        "node /home/nextjs/validate-env.mjs && if command -v timeout >/dev/null 2>&1; then timeout 300 node packages/database/dist/scripts/apply-migrations.js; else node packages/database/dist/scripts/apply-migrations.js; fi",
      ]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      WEBAPP_URL: ${WEBAPP_URL}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      PUBLIC_URL: ${PUBLIC_URL}
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/formbricks?schema=public
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      CRON_SECRET: ${CRON_SECRET}
      REDIS_URL: redis://redis:6379
      HUB_API_URL: ${HUB_API_URL:-http://hub:8080}
      HUB_API_KEY: ${HUB_API_KEY}
      CUBEJS_API_URL: ${CUBEJS_API_URL:-http://cube:4000}
      CUBEJS_API_SECRET: ${CUBEJS_API_SECRET}
      CUBEJS_JWT_ISSUER: ${CUBEJS_JWT_ISSUER:-formbricks-web}
      CUBEJS_JWT_AUDIENCE: ${CUBEJS_JWT_AUDIENCE:-formbricks-cube}
      EMAIL_VERIFICATION_DISABLED: ${EMAIL_VERIFICATION_DISABLED:-1}
      PASSWORD_RESET_DISABLED: ${PASSWORD_RESET_DISABLED:-1}
      TELEMETRY_DISABLED: ${TELEMETRY_DISABLED:-1}
      AUTHZED_ENABLED: ${AUTHZED_ENABLED:-true}
      AUTHZED_ENDPOINT: ${AUTHZED_ENDPOINT:-spicedb:50051}
      AUTHZED_TOKEN: ${AUTHZED_TOKEN}
      AUTHZED_SYSTEM_KEY: ${AUTHZED_SYSTEM_KEY:-formbricks}
      AUTHZED_INSECURE: ${AUTHZED_INSECURE:-true}
      AUTHZED_CONSISTENCY: ${AUTHZED_CONSISTENCY:-fully_consistent}

  formbricks:
    restart: always
    image: ghcr.io/formbricks/formbricks:latest
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      cube:
        condition: service_healthy
    expose:
      - "3000"
    volumes:
      - uploads:/home/nextjs/apps/web/uploads
      - saml-connection:/home/nextjs/apps/web/saml-connection
    environment:
      WEBAPP_URL: ${WEBAPP_URL}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      PUBLIC_URL: ${PUBLIC_URL}
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/formbricks?schema=public
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      CRON_SECRET: ${CRON_SECRET}
      REDIS_URL: redis://redis:6379
      HUB_API_URL: ${HUB_API_URL:-http://hub:8080}
      HUB_API_KEY: ${HUB_API_KEY}
      CUBEJS_API_URL: ${CUBEJS_API_URL:-http://cube:4000}
      CUBEJS_API_SECRET: ${CUBEJS_API_SECRET}
      CUBEJS_JWT_ISSUER: ${CUBEJS_JWT_ISSUER:-formbricks-web}
      CUBEJS_JWT_AUDIENCE: ${CUBEJS_JWT_AUDIENCE:-formbricks-cube}
      EMAIL_VERIFICATION_DISABLED: ${EMAIL_VERIFICATION_DISABLED:-1}
      PASSWORD_RESET_DISABLED: ${PASSWORD_RESET_DISABLED:-1}
      TELEMETRY_DISABLED: ${TELEMETRY_DISABLED:-1}
      SKIP_STARTUP_MIGRATION: "true"
      AUTHZED_ENABLED: ${AUTHZED_ENABLED:-true}
      AUTHZED_ENDPOINT: ${AUTHZED_ENDPOINT:-spicedb:50051}
      AUTHZED_TOKEN: ${AUTHZED_TOKEN}
      AUTHZED_SYSTEM_KEY: ${AUTHZED_SYSTEM_KEY:-formbricks}
      AUTHZED_INSECURE: ${AUTHZED_INSECURE:-true}
      AUTHZED_CONSISTENCY: ${AUTHZED_CONSISTENCY:-fully_consistent}

  authzed-initialize:
    image: ghcr.io/formbricks/formbricks:latest
    restart: "no"
    exclude_from_hc: true
    entrypoint: ["formbricks-authzed"]
    command: ["upgrade", "prepare"]
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/formbricks?schema=public
      ENCRYPTION_KEY: authzed-initialize-unused
      CUBEJS_API_SECRET: authzed-initialize-unused
      CUBEJS_API_URL: http://localhost
      HUB_API_KEY: authzed-initialize-unused
      HUB_API_URL: http://localhost
      REDIS_URL: redis://localhost
      LOG_LEVEL: fatal
      AUTHZED_ENABLED: ${AUTHZED_ENABLED:-true}
      AUTHZED_ENDPOINT: ${AUTHZED_ENDPOINT:-spicedb:50051}
      AUTHZED_TOKEN: ${AUTHZED_TOKEN}
      AUTHZED_SYSTEM_KEY: ${AUTHZED_SYSTEM_KEY:-formbricks}
      AUTHZED_INSECURE: ${AUTHZED_INSECURE:-true}
      AUTHZED_CONSISTENCY: ${AUTHZED_CONSISTENCY:-fully_consistent}
    depends_on:
      formbricks-migrate:
        condition: service_completed_successfully
      spicedb:
        condition: service_healthy

  hub-migrate:
    image: ghcr.io/formbricks/hub:latest
    restart: "no"
    exclude_from_hc: true
    entrypoint: ["sh", "-c"]
    command:
      [
        'if [ -x /usr/local/bin/goose ] && [ -x /usr/local/bin/river ]; then /usr/local/bin/goose -dir /app/migrations postgres "$$DATABASE_URL" up && /usr/local/bin/river migrate-up --database-url "$$DATABASE_URL"; else echo ''Migration tools (goose/river) not in image.''; exit 1; fi',
      ]
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/formbricks?sslmode=disable
    depends_on:
      formbricks-migrate:
        condition: service_completed_successfully

  hub:
    restart: always
    image: ghcr.io/formbricks/hub:latest
    depends_on:
      hub-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/formbricks?sslmode=disable
      API_KEY: ${HUB_API_KEY}

  hub-worker:
    restart: always
    image: ghcr.io/formbricks/hub:latest
    depends_on:
      hub-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    entrypoint: ["/app/hub-worker"]
    healthcheck:
      disable: true
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/formbricks?sslmode=disable

  cube:
    restart: always
    build:
      context: ./cube
      dockerfile: Dockerfile.coolify
    depends_on:
      hub-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      CUBEJS_DB_TYPE: postgres
      CUBEJS_DB_HOST: postgres
      CUBEJS_DB_NAME: formbricks
      CUBEJS_DB_USER: postgres
      CUBEJS_DB_PASS: ${POSTGRES_PASSWORD}
      CUBEJS_DB_PORT: "5432"
      CUBEJS_API_SECRET: ${CUBEJS_API_SECRET}
      CUBEJS_JWT_ISSUER: ${CUBEJS_JWT_ISSUER:-formbricks-web}
      CUBEJS_JWT_AUDIENCE: ${CUBEJS_JWT_AUDIENCE:-formbricks-cube}
      CUBEJS_DEFAULT_API_SCOPES: meta,data
      CUBEJS_EXTERNAL_DEFAULT: ${CUBEJS_EXTERNAL_DEFAULT:-false}
      CUBEJS_CACHE_AND_QUEUE_DRIVER: memory
      CUBEJS_DB_QUERY_TIMEOUT: ${CUBEJS_DB_QUERY_TIMEOUT:-60s}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:4000/readyz', (res) => { res.resume(); process.exit(res.statusCode === 200 ? 0 : 1); }).on('error', () => process.exit(1));",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  postgres:
    driver: local
  redis:
    driver: local
  uploads:
    driver: local
  saml-connection:
    driver: local

